# Initial HTTP virtual host; use Certbot to add TLS and redirect HTTP.
<VirtualHost *:80>
    ServerName api-vesper.sprigan.my.id

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    # Change to https in the generated port 443 virtual host.
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
