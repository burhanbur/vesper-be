services:
  redis:
    image: redis:7
    container_name: vesper-redis
    restart: unless-stopped
    ports:
      - '6370:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
